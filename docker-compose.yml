services:
  mesh:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: mesh:latest
    container_name: mesh

    # Container labels for traceability
    labels:
      - "com.mesh.service=mesh"
      - "com.mesh.version=1.0.0"
      - "com.mesh.environment=production"
      - "com.mesh.description=AI-powered Model Context Protocol server"
    
    # Environment variables
    environment:
      # Default model configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-auto}

      # OpenRouter is the only HTTP fallback (use Docker secrets in production)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_ALLOWED_MODELS=${OPENROUTER_ALLOWED_MODELS}

      # CLI providers (gemini/codex). Override discovery via these env vars.
      - GEMINI_CLI_PATH=${GEMINI_CLI_PATH}
      - CODEX_CLI_PATH=${CODEX_CLI_PATH}
      - CLI_TIMEOUT_SECONDS=${CLI_TIMEOUT_SECONDS:-30}

      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_MAX_SIZE=${LOG_MAX_SIZE:-10MB}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-5}
      
      # Advanced configuration
      - DEFAULT_THINKING_MODE_THINKDEEP=${DEFAULT_THINKING_MODE_THINKDEEP:-high}
      - DISABLED_TOOLS=${DISABLED_TOOLS}
      - MAX_MCP_OUTPUT_TOKENS=${MAX_MCP_OUTPUT_TOKENS}
      
      # Server configuration
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=${TZ:-UTC}
    
    # Volumes for persistent data
    volumes:
      - ./logs:/app/logs
      - mesh-config:/app/conf
      - /etc/localtime:/etc/localtime:ro
    
    # Network configuration
    networks:
      - mesh-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/tmp:noexec,nosuid,size=50m

# Named volumes
volumes:
  mesh-config:
    driver: local

# Networks
networks:
  mesh-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
